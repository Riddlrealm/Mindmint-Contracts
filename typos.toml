# typos-cli configuration: https://github.com/crate-ci/typos

[default.extend-identifiers]
# False positives — identifiers our codebase legitimately uses.

[default.extend-words]
# Words that are correct despite looking like typos.
soroban = "soroban"
noqa = "noqa"
nd = "nd"           # suffix of `reward_2nd` / `reward_3rd`
groth = "groth"     # Groth16 zk-SNARK construction
issu = "issu"       # `symbol_short!("tkt_issu")`; capped at 9 chars

name: fmt

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: fmt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        # Enforced: the tree is rustfmt-clean. Run `cargo fmt --all` locally
        # before pushing if this fails.
        run: cargo fmt --all -- --check
